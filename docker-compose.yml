services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shoppinglist-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - shoppinglist-network
    environment:
      # DB_CONNECTION and DB_DATABASE are deliberately NOT set here. A real environment
      # variable takes precedence over phpunit.xml's <env> entries (which are not forced),
      # so injecting them made `php artisan test` run against the DEVELOPMENT database and
      # truncate it on every RefreshDatabase run. They come from .env instead, which Laravel
      # loads with safeLoad() and therefore never overrides phpunit's test values.
      # Do not add them back — and do not "fix" this with force="true" in phpunit.xml, which
      # would break CI: the Tests job sets DB_DATABASE=test on purpose for its own service.
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-shoppinglist}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep 'php-fpm: master' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: shoppinglist-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - shoppinglist-network
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: shoppinglist-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shoppinglist}
      POSTGRES_USER: ${DB_USERNAME:-shoppinglist}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    ports:
      - "54321:5432"
    networks:
      - shoppinglist-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shoppinglist} -d ${DB_DATABASE:-shoppinglist}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: shoppinglist-redis
    restart: unless-stopped
    ports:
      - "63791:6379"
    volumes:
      - redis-data:/data
    networks:
      - shoppinglist-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shoppinglist-scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - shoppinglist-network
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan schedule:work

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shoppinglist-queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - shoppinglist-network
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work --tries=3 --timeout=60

networks:
  shoppinglist-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
